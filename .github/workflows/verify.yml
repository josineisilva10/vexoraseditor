name: Verify VEXORA SAMPLER
on:
  push:
    branches: [main, feature/vexora-license-activation]
  pull_request:
    branches: [main]
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test -- --passWithNoTests
